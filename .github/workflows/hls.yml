name: Convert Video to Hugging Face Bucket HLS

on:
  workflow_dispatch:
    inputs:
      hf_path:
        description: "Hugging Face bucket output folder path"
        required: true
        type: string
        default: hls

      video_name:
        description: "Final video folder name"
        required: true
        type: string
        default: my-video

      video_url:
        description: "Direct MP4, MKV or HEVC video URL"
        required: true
        type: string

      input_format:
        description: "Video input format"
        required: true
        type: choice
        options:
          - auto
          - mp4
          - mkv
          - hevc
        default: auto

      segment_duration:
        description: "HLS segment duration in seconds"
        required: true
        type: number
        default: 6

permissions:
  contents: read

concurrency:
  group: hf-hls-bucket-upload
  cancel-in-progress: false

jobs:
  convert-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python, FFmpeg and Hugging Face CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3 python3-pip python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip huggingface_hub
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          ffmpeg -version
          node --version
          hf --version

      - name: Validate inputs and bucket access
        env:
          HF_PATH: ${{ inputs.hf_path }}
          VIDEO_NAME: ${{ inputs.video_name }}
          VIDEO_URL: ${{ inputs.video_url }}
          SEGMENT_DURATION: ${{ inputs.segment_duration }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET_ID: ${{ secrets.HF_BUCKET_ID }}
        run: |
          set -euo pipefail
          test -n "$HF_PATH"
          test -n "$VIDEO_NAME"
          test -n "$VIDEO_URL"
          test -n "$HF_TOKEN"
          test -n "$HF_BUCKET_ID"

          if ! [[ "$HF_BUCKET_ID" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "HF_BUCKET_ID must be namespace/bucket-name"
            exit 1
          fi

          if ! [[ "$SEGMENT_DURATION" =~ ^[0-9]+$ ]] || [ "$SEGMENT_DURATION" -lt 1 ] || [ "$SEGMENT_DURATION" -gt 60 ]; then
            echo "Segment duration must be between 1 and 60 seconds"
            exit 1
          fi

          hf buckets info "$HF_BUCKET_ID"
          echo "Bucket access verified."

      - name: Download, convert and upload to Hugging Face Bucket
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_NAME: ${{ inputs.video_name }}
          INPUT_FORMAT: ${{ inputs.input_format }}
          SEGMENT_DURATION: ${{ inputs.segment_duration }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET_ID: ${{ secrets.HF_BUCKET_ID }}
          HF_PATH: ${{ inputs.hf_path }}
          WORK_DIR: temp-work
        run: node index.mjs

      - name: Cleanup temporary files
        if: always()
        run: rm -rf temp-work .venv
