
name: Convert Video to Hugging Face HLS

on:
  workflow_dispatch:
    inputs:
      hf_path:
        description: "Hugging Face output folder path"
        required: true
        type: string
        default: hls

      video_name:
        description: "Final video folder name"
        required: true
        type: string
        default: my-video

      video_url:
        description: "Direct MP4, MKV or HEVC video URL"
        required: true
        type: string

      input_format:
        description: "Video input format"
        required: true
        type: choice
        options:
          - auto
          - mp4
          - mkv
          - hevc
        default: auto

      segment_duration:
        description: "HLS segment duration in seconds"
        required: true
        type: number
        default: 6

permissions:
  contents: read

concurrency:
  group: hf-hls-upload
  cancel-in-progress: false

jobs:
  convert-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg, Git and Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git git-lfs curl
          git lfs install

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Validate workflow inputs
        env:
          HF_PATH: ${{ inputs.hf_path }}
          VIDEO_NAME: ${{ inputs.video_name }}
          VIDEO_URL: ${{ inputs.video_url }}
          SEGMENT_DURATION: ${{ inputs.segment_duration }}
        run: |
          set -e

          test -n "$HF_PATH"
          test -n "$VIDEO_NAME"
          test -n "$VIDEO_URL"

          if ! [[ "$SEGMENT_DURATION" =~ ^[0-9]+$ ]]; then
            echo "Invalid segment duration"
            exit 1
          fi

          if [ "$SEGMENT_DURATION" -lt 1 ] || [ "$SEGMENT_DURATION" -gt 60 ]; then
            echo "Segment duration must be between 1 and 60 seconds"
            exit 1
          fi

          echo "All inputs validated."

      - name: Download, convert and upload to Hugging Face
        env:
          OUTPUT_DIR: ${{ inputs.hf_path }}
          VIDEO_NAME: ${{ inputs.video_name }}
          VIDEO_URL: ${{ inputs.video_url }}
          INPUT_FORMAT: ${{ inputs.input_format }}
          SEGMENT_DURATION: ${{ inputs.segment_duration }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          HF_REPO_TYPE: dataset

        run: node index.cjs

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf temp-work hls-output
