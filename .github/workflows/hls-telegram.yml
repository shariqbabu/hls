name: Video URL to HLS Telegram

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct media URL or FFmpeg-supported input URL"
        required: true
        type: string
      movie_name:
        description: "Movie / Video Name"
        required: true
        type: string
      segment_time:
        description: "HLS Segment Duration (seconds)"
        required: false
        default: "10"
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
      WORKER_URL: "https://live.betadda.workers.dev/api/tg/stream"
      TG_UPLOAD_CONCURRENCY: "8"
      TG_UPLOAD_TIMEOUT: "900"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & System Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          ffmpeg -version | head -n 1
          python3 --version

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
          python3 -m pip install telethon aiohttp
          python3 -c "import telethon; print('Telethon version:', telethon.__version__)"

      - name: Validate Python Script Syntax
        run: |
          set -euo pipefail
          if [ -f scripts/process.py ]; then
            python3 -m py_compile scripts/process.py
          elif [ -f process.py ]; then
            python3 -m py_compile process.py
          else
            echo "process.py file not found!"
            exit 1
          fi

      - name: Prepare Workspace
        run: |
          set -euo pipefail
          rm -rf /tmp/hls_pipeline
          mkdir -p /tmp/hls_pipeline/hls
          df -h /tmp

      - name: Check Telegram Configuration
        run: |
          set -euo pipefail
          for var in TG_API_ID TG_API_HASH TG_CHANNEL; do
            if [ -z "${!var}" ]; then
              echo "Missing secret: $var"
              exit 1
            fi
          done
          if [ -z "${TG_BOT_TOKEN:-}" ] && [ -z "${TG_SESSION:-}" ]; then
            echo "Either TG_BOT_TOKEN or TG_SESSION is required."
            exit 1
          fi

      - name: Validate FFmpeg Input URL
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          if [ -z "${VIDEO_URL:-}" ]; then
            echo "VIDEO_URL is empty."
            exit 1
          fi
          echo "Probing actual media/container with FFprobe..."
          timeout 120 ffprobe \
            -hide_banner \
            -v error \
            -rw_timeout 30000000 \
            -analyzeduration 100M \
            -probesize 100M \
            -show_entries format=format_name,duration,size \
            -show_entries stream=index,codec_name,codec_type,width,height,channels,sample_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO_URL"
          echo "Input probe successful."

      - name: Create HLS
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          SEGMENT_TIME: ${{ inputs.segment_time }}
        run: |
          set -euo pipefail
          if ! [[ "$SEGMENT_TIME" =~ ^[1-9][0-9]*([.][0-9]+)?$ ]]; then
            echo "SEGMENT_TIME must be a positive number."
            exit 1
          fi

          rm -rf /tmp/hls_pipeline/hls/*
          ffmpeg \
            -hide_banner \
            -y \
            -i "$VIDEO_URL" \
            -map 0:v:0 \
            -map 0:a:0? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -sc_threshold 0 \
            -force_key_frames "expr:gte(t,n_forced*${SEGMENT_TIME})" \
            -c:a aac \
            -b:a 192k \
            -ac 2 \
            -fflags +genpts \
            -avoid_negative_ts make_zero \
            -f hls \
            -hls_time "$SEGMENT_TIME" \
            -hls_playlist_type vod \
            -hls_flags independent_segments \
            -hls_segment_filename "/tmp/hls_pipeline/hls/segment_%05d.ts" \
            /tmp/hls_pipeline/hls/local.m3u8

          ls -lh /tmp/hls_pipeline/hls/
          cat /tmp/hls_pipeline/hls/local.m3u8

      - name: Check Segments
        run: |
          set -euo pipefail
          COUNT=$(find /tmp/hls_pipeline/hls -name "segment_*.ts" -type f | wc -l)
          echo "Segments: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No HLS segments generated."
            exit 1
          fi

      - name: Upload HLS to Telegram
        env:
          MOVIE_NAME: ${{ inputs.movie_name }}
        run: |
          set -euo pipefail
          if [ -f scripts/process.py ]; then
            python3 scripts/process.py /tmp/hls_pipeline/hls "$MOVIE_NAME"
          elif [ -f process.py ]; then
            python3 process.py /tmp/hls_pipeline/hls "$MOVIE_NAME"
          else
            echo "process.py script not found."
            exit 1
          fi

      - name: Show Final Output
        if: success()
        run: |
          set -euo pipefail
          cat /tmp/hls_pipeline/hls/index.m3u8
          cat /tmp/hls_pipeline/hls/mapping.json

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/hls_pipeline
          echo "Cleanup complete."
