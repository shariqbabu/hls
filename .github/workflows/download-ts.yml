name: Download TS Files

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Paste multiple TS URLs"
        required: true
        type: string

      folder:
        description: "Save folder"
        required: false
        default: "downloads"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TS files
        env:
          URLS: ${{ inputs.urls }}
          FOLDER: ${{ inputs.folder }}
        shell: bash
        run: |

          set -uo pipefail

          mkdir -p "$FOLDER"

          total=0
          success=0
          failed=0

          echo "Extracting URLs..."

          # Extract every http/https URL from the complete input.
          # Works even if GitHub combines multiple lines into one string.
          mapfile -t URL_LIST < <(
            printf '%s' "$URLS" |
            tr '\r\n\t' '   ' |
            grep -oE 'https?://[^[:space:]]+'
          )

          echo "Found ${#URL_LIST[@]} URL(s)"

          for url in "${URL_LIST[@]}"; do

            # Remove accidental surrounding characters
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            url="${url#\"}"
            url="${url%\"}"
            url="${url#\'}"
            url="${url%\'}"

            [ -z "$url" ] && continue

            total=$((total + 1))

            echo ""
            echo "======================================"
            echo "URL #$total"
            echo "$url"
            echo "======================================"

            # Extract filename from URL path
            path="${url%%\?*}"
            filename="$(basename "$path")"

            # Remove unsafe filename characters
            filename="$(printf '%s' "$filename" | sed 's/[<>:"\/\\|?*]/_/g')"

            # If filename is not a TS file
            if [ -z "$filename" ] || [[ "$filename" != *.ts ]]; then
              filename="segment_${total}.ts"
            fi

            output="$FOLDER/$filename"

            # Avoid duplicate filename
            if [ -f "$output" ]; then

              name="${filename%.ts}"
              n=2

              while [ -f "$FOLDER/${name}_${n}.ts" ]; do
                n=$((n + 1))
              done

              output="$FOLDER/${name}_${n}.ts"

            fi

            echo "Saving: $output"

            if curl \
              -L \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 30 \
              --max-time 600 \
              -A "Mozilla/5.0" \
              "$url" \
              -o "$output"
            then

              if [ -s "$output" ]; then

                size="$(du -h "$output" | cut -f1)"

                echo "SUCCESS: $output ($size)"

                success=$((success + 1))

              else

                echo "::error::Downloaded file is empty"
                rm -f "$output"

                failed=$((failed + 1))

              fi

            else

              echo "::error::Download failed"
              rm -f "$output"

              failed=$((failed + 1))

            fi

          done

          echo ""
          echo "======================================"
          echo "DOWNLOAD SUMMARY"
          echo "======================================"
          echo "Total:   $total"
          echo "Success: $success"
          echo "Failed:  $failed"
          echo "======================================"

          if [ "$success" -eq 0 ]; then
            echo "::error::No files were downloaded."
            exit 1
          fi

      - name: Show downloaded files
        run: |

          echo "Downloaded TS files:"

          find "${{ inputs.folder }}" \
            -type f \
            -name "*.ts" \
            -printf "%p - %s bytes\n" |
            sort

      - name: Commit files
        shell: bash
        run: |

          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ inputs.folder }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Download TS files"
          git push
