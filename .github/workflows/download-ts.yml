name: Download TS Files

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "TS file URLs - one URL per line"
        required: true
        type: string
      folder:
        description: "Save folder"
        required: false
        default: "downloads"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TS files
        env:
          URLS: ${{ inputs.urls }}
          FOLDER: ${{ inputs.folder }}
        run: |
          mkdir -p "$FOLDER"

          count=0

          while IFS= read -r url || [ -n "$url" ]; do
            url="$(echo "$url" | xargs)"
            [ -z "$url" ] && continue

            count=$((count + 1))

            filename="$(basename "${url%%\?*}")"

            if [ -z "$filename" ] || [[ "$filename" != *.ts ]]; then
              filename="segment_${count}.ts"
            fi

            echo "Downloading: $url"
            echo "Saving: $FOLDER/$filename"

            curl -L \
              --fail \
              --retry 3 \
              -A "Mozilla/5.0" \
              "$url" \
              -o "$FOLDER/$filename"

          done <<< "$URLS"

          echo "Downloaded $count file(s)."

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add downloads/

          if git diff --cached --quiet; then
            echo "No files to commit"
            exit 0
          fi

          git commit -m "Download TS files"
          git push
