name: Download TS Files

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "TS URLs - one URL per line"
        required: true
        type: string
      folder:
        description: "Save folder"
        required: false
        default: "downloads"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TS files
        env:
          URLS: ${{ inputs.urls }}
          FOLDER: ${{ inputs.folder }}
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$FOLDER"

          total=0
          success=0
          failed=0

          while IFS= read -r raw_url || [ -n "$raw_url" ]; do

            url="$(printf '%s' "$raw_url" | tr -d '\r')"
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            # Remove surrounding quotes
            url="${url#\"}"
            url="${url%\"}"
            url="${url#\'}"
            url="${url%\'}"

            # Skip empty lines
            [ -z "$url" ] && continue

            total=$((total + 1))

            echo ""
            echo "================================="
            echo "URL #$total"
            echo "$url"
            echo "================================="

            # Validate URL
            if [[ ! "$url" =~ ^https?://[^[:space:]]+$ ]]; then
              echo "::error::Invalid URL: $url"
              failed=$((failed + 1))
              continue
            fi

            # Extract filename without query string
            path="${url%%\?*}"
            filename="$(basename "$path")"

            # If filename is not .ts, generate one
            if [ -z "$filename" ] || [[ "$filename" != *.ts ]]; then
              filename="segment_${total}.ts"
            fi

            output="$FOLDER/$filename"

            # Avoid duplicate filenames
            if [ -f "$output" ]; then
              name="${filename%.ts}"
              n=2

              while [ -f "$FOLDER/${name}_${n}.ts" ]; do
                n=$((n + 1))
              done

              output="$FOLDER/${name}_${n}.ts"
            fi

            echo "Saving: $output"

            if curl \
              -L \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 30 \
              --max-time 600 \
              -A "Mozilla/5.0" \
              "$url" \
              -o "$output"
            then

              if [ -s "$output" ]; then
                size="$(du -h "$output" | cut -f1)"
                echo "SUCCESS: $output ($size)"
                success=$((success + 1))
              else
                echo "::error::Empty file: $output"
                rm -f "$output"
                failed=$((failed + 1))
              fi

            else
              echo "::error::Download failed: $url"
              rm -f "$output"
              failed=$((failed + 1))
            fi

          done <<< "$URLS"

          echo ""
          echo "================================="
          echo "DOWNLOAD SUMMARY"
          echo "Total:   $total"
          echo "Success: $success"
          echo "Failed:  $failed"
          echo "================================="

          if [ "$success" -eq 0 ]; then
            exit 1
          fi

      - name: Show downloaded files
        run: |
          find "${{ inputs.folder }}" \
            -type f \
            -name "*.ts" \
            -printf "%p - %s bytes\n" | sort

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ inputs.folder }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Download TS files"
          git push
