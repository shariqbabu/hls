import os, zipfile

base = "/mnt/data/github-ts-downloader-fixed"
os.makedirs(base + "/.github/workflows", exist_ok=True)

workflow = r'''name: Download TS Files

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Paste TS URLs - one URL per line"
        required: true
        type: string
      folder:
        description: "Folder to save files"
        required: false
        default: "downloads"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TS files
        env:
          URLS: ${{ inputs.urls }}
          FOLDER: ${{ inputs.folder }}
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$FOLDER"

          count=0
          success=0
          failed=0

          while IFS= read -r raw_url || [ -n "$raw_url" ]; do
            # Remove Windows CR, leading/trailing whitespace and surrounding quotes
            url="$(printf '%s' "$raw_url" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            url="${url#\"}"
            url="${url%\"}"
            url="${url#\'}"
            url="${url%\'}"

            # Ignore empty lines
            [ -z "$url" ] && continue

            count=$((count + 1))

            echo ""
            echo "========================================"
            echo "File #$count"
            echo "URL: $url"
            echo "========================================"

            # Validate URL before calling curl
            if [[ ! "$url" =~ ^https?://[^[:space:]]+$ ]]; then
              echo "::error::Invalid URL skipped: $url"
              failed=$((failed + 1))
              continue
            fi

            # Get filename from URL path, ignoring query string
            path="${url%%\?*}"
            filename="$(basename "$path")"

            # Remove characters that cannot safely be used in a filename
            filename="$(printf '%s' "$filename" | sed 's/[<>:"\/\\|?*]/_/g')"

            # If URL has no usable .ts filename, generate one
            if [ -z "$filename" ] || [ "$filename" = "." ] || [ "$filename" = "/" ] || [[ "$filename" != *.ts ]]; then
              filename="segment_${count}.ts"
            fi

            # Avoid overwriting a file downloaded earlier in the same run
            output="$FOLDER/$filename"
            if [ -e "$output" ]; then
              stem="${filename%.ts}"
              n=2
              while [ -e "$FOLDER/${stem}_${n}.ts" ]; do
                n=$((n + 1))
              done
              output="$FOLDER/${stem}_${n}.ts"
            fi

            echo "Saving: $output"

            if curl -L \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 30 \
              --max-time 600 \
              -A "Mozilla/5.0" \
              "$url" \
              -o "$output"; then

              if [ -s "$output" ]; then
                size="$(du -h "$output" | cut -f1)"
                echo "SUCCESS: $output ($size)"
                success=$((success + 1))
              else
                echo "::error::Downloaded file is empty: $output"
                rm -f "$output"
                failed=$((failed + 1))
              fi
            else
              echo "::error::Download failed: $url"
              rm -f "$output"
              failed=$((failed + 1))
            fi

          done <<< "$URLS"

          echo ""
          echo "========================================"
          echo "DOWNLOAD SUMMARY"
          echo "Total:   $count"
          echo "Success: $success"
          echo "Failed:  $failed"
          echo "========================================"

          if [ "$success" -eq 0 ]; then
            echo "::error::No files were downloaded."
            exit 1
          fi

      - name: Show downloaded files
        run: |
          echo "Files in ${{ inputs.folder }}:"
          find "${{ inputs.folder }}" -type f -name "*.ts" -printf '%p - %s bytes\n' | sort

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ inputs.folder }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Download TS files"
          git push
'''

readme = r'''# Multiple TS URL Downloader

GitHub Actions workflow for downloading multiple authorized `.ts` files and committing them into the repository.

## Input

Go to:

Actions → Download TS Files → Run workflow

Paste one URL per line:

https://example.com/segment0.ts
https://example.com/segment1.ts
https://example.com/segment2.ts

The default destination is:

downloads/

The workflow cleans Windows line endings and whitespace, validates URLs, generates a filename when needed, avoids filename collisions, and commits successful downloads.

Only use URLs for files you are authorized to download and store.
'''

with open(base + "/.github/workflows/download-ts.yml", "w", encoding="utf-8") as f:
    f.write(workflow)

with open(base + "/README.md", "w", encoding="utf-8") as f:
    f.write(readme)

zip_path = "/mnt/data/github-ts-downloader-fixed.zip"
with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
    for root, _, files in os.walk(base):
        for name in files:
            path = os.path.join(root, name)
            z.write(path, os.path.relpath(path, base))

print(zip_path)
