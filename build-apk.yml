name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

jobs:
  build:
    name: 🚀 Build Android APK (DataPulse AI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant Execute Permission to Gradlew
        run: |
          chmod +x gradlew || true
          if [ -f "DataAnalyticsAI/gradlew" ]; then
            chmod +x DataAnalyticsAI/gradlew || true
          fi

      - name: 🐘 Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          if [ -d "DataAnalyticsAI" ]; then
            cd DataAnalyticsAI
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔨 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -d "DataAnalyticsAI" ]; then
            cd DataAnalyticsAI
          fi
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 📦 Prepare & Rename APKs
        id: prepare_apks
        run: |
          mkdir -p build_output
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          # Find and copy Debug APK
          DEBUG_APK=$(find . -name "*debug*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "build_output/DataPulse-AI-debug-$SHORT_SHA.apk"
            echo "debug_apk=build_output/DataPulse-AI-debug-$SHORT_SHA.apk" >> $GITHUB_OUTPUT
            echo "✅ Found Debug APK: $DEBUG_APK"
          fi

          # Find and copy Release APK
          RELEASE_APK=$(find . -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "build_output/DataPulse-AI-release-$SHORT_SHA.apk"
            echo "release_apk=build_output/DataPulse-AI-release-$SHORT_SHA.apk" >> $GITHUB_OUTPUT
            echo "✅ Found Release APK: $RELEASE_APK"
          fi

      - name: 📤 Upload Debug APK Artifact
        if: steps.prepare_apks.outputs.debug_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: DataPulse-AI-Debug-APK
          path: ${{ steps.prepare_apks.outputs.debug_apk }}
          retention-days: 14

      - name: 📤 Upload Release APK Artifact
        if: steps.prepare_apks.outputs.release_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: DataPulse-AI-Release-APK
          path: ${{ steps.prepare_apks.outputs.release_apk }}
          retention-days: 30

      - name: 🌟 Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
